name: App checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audit
      - run: npx --no-install playwright install --with-deps chromium webkit firefox
      - name: Test the built game and recorded detector in all three engines
        run: npm run test:browser
      - name: Retain browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: .cache/browser-results/
          if-no-files-found: ignore
